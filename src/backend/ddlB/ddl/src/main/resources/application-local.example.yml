# 复制为 application-local.yml（已在 .gitignore，勿提交 Git）
spring:
  datasource:
    # 与本机 MySQL root 密码一致；错误会报 Access denied for user 'root'@'localhost'
    password: "050501"
  mail:
    host: smtp.qq.com
    port: 465
    protocol: smtps
    default-encoding: UTF-8
    username: your@qq.com
    password: your-smtp-authorization-code
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.required: true
      mail.smtp.ssl.trust: smtp.qq.com
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory
      mail.smtp.socketFactory.port: 465
      mail.smtp.socketFactory.fallback: false

ddl:
  mail:
    from: your@qq.com
