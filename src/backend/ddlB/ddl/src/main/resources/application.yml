server:
  port: 8080 # 后端服务启动端口

spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    # 与本地 MySQL 一致；密码不对会报 Access denied for user 'root'@'localhost'
    # 推荐在 IDEA Run Configuration → Environment variables 中设置 MYSQL_PASSWORD，勿把真实密码提交到 Git
    username: root
    # 密码若以 0 开头，必须加引号，否则 YAML 可能按八进制解析，导致与 MySQL 实际密码不一致
    password: "050501"
    # createDatabaseIfNotExist：库 ddl_db 不存在时由驱动自动创建（仍需本机 MySQL 服务已启动）
    # allowPublicKeyRetrieval：MySQL 8 默认 caching_sha2_password，本地开发需允许取公钥，否则报 Public Key Retrieval is not allowed
    url: jdbc:mysql://localhost:3306/ddl_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 启动时执行 classpath:schema.sql（表已存在则跳过）
  sql:
    init:
      mode: always
      encoding: UTF-8
      # schema-migration 对已有库执行 ALTER；列已存在时会报错，由 continue-on-error 忽略
      schema-locations: classpath:schema.sql,classpath:schema-migration.sql
      continue-on-error: true

# 邮件（QQ 推荐 465+SSL，见 application-local.example.yml）。未配置时演示模式：内容输出到控制台
spring.mail:
  host: ${MAIL_HOST:smtp.qq.com}
  port: ${MAIL_PORT:465}
  protocol: ${MAIL_PROTOCOL:smtps}
  default-encoding: UTF-8
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.ssl.enable: ${MAIL_SSL_ENABLE:true}
    mail.smtp.ssl.required: true
    mail.smtp.ssl.trust: ${MAIL_HOST:smtp.qq.com}
    mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:false}

ddl:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

mybatis-plus:
  configuration:
    # 开启驼峰命名自动映射 (如 user_id 自动映射为 userId)
    map-underscore-to-camel-case: true
    # 打印底层 SQL 语句，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 全局主键策略：对应你的 String 类型 UUID
      id-type: assign_uuid